name: Workflow to build Docker image
on:
  workflow_call:
    outputs:
      docker_tags:
        description: "docker image full name"
        value: ${{ jobs.build.outputs.docker_tags }}
      runner:
        description: "build runner name"
        value: ${{ jobs.build.outputs.runner }}
    inputs:
      project:
        required: true
        type: string
      component:
        # not required now
        required: false
        type: string
      node_env:
        required: false
        type: string
        default: "production"
      load:
        required: false
        type: boolean
        default: true
      push:
        required: false
        type: boolean
        default: true
      platforms:
        description: "comma-separated target platforms for the pushed image, e.g. linux/amd64,linux/arm64. Empty = runner's native platform"
        required: false
        type: string
        default: ""
      docker_context:
        description: "the path where docker build execute."
        required: false
        default: "./"
        type: string
      docker_file:
        description: "the Dockerfile to build"
        required: false
        default: "./Dockerfile"
        type: string
      runner:
        ## ['cn', 'us', 'cn1', 'cn2', 'cn3', 'us1', 'us2', 'us3']
        type: string
        default: "cn"
        required: false
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
      NPM_TOKEN:
        required: false

jobs:
  build:
    name: build docker image
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      COMPONENT_NAME: "${{ inputs.component || github.event.repository.name }}"
      REGISTRY: "registry.wiredcraft.net"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      # Add support for more platforms with QEMU (optional)
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ inputs.project }}/${{ env.COMPONENT_NAME }}
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=ref,event=tag

      - name: Login to PrivateRegistry
        # https://github.com/actions/runner/issues/1483
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD}}

      - name: Load to local registry
        uses: docker/build-push-action@v5
        # `load` imports into the local docker daemon, which cannot hold a manifest
        # list, so it is meaningless for a multi-platform build and only costs an
        # export of the whole image. Nothing in this workflow consumes the loaded
        # image anyway: the scan job runs on a different runner.
        if: ${{ inputs.load && !contains(inputs.platforms, ',') }}
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.docker_file }}
          builder: ${{ steps.buildx.outputs.name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ inputs.load }}
          build-args: |
            OMNI_COMPONENT=${{ env.COMPONENT_NAME }}
            NODE_ENV=${{ inputs.node_env }}
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
            OMNI_COMPONENT_COMMIT=${{ github.sha }}
            OMNI_COMPONENT_VERSION=${{ steps.meta.outputs.version }}

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.docker_file }}
          builder: ${{ steps.buildx.outputs.name }}
          push: ${{ inputs.push }}
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without a cache every build starts cold, and on an x86 runner the arm64
          # pass runs under QEMU, where `yarn install` is by far the most expensive
          # layer. The Dockerfiles copy package.json and yarn.lock before the source,
          # so that layer is keyed on the lockfile: a code-only change reuses it
          # instead of re-emulating the whole install.
          # mode=max also caches intermediate builder stages, not just the final one.
          # image-manifest/oci-mediatypes keep the cache object in a form Harbor
          # accepts. The ref is shared across branches on purpose, since branches
          # share base and dependency layers.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ inputs.project }}/${{ env.COMPONENT_NAME }}:buildcache
          cache-to: ${{ inputs.push && format('type=registry,ref={0}/{1}/{2}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', env.REGISTRY, inputs.project, env.COMPONENT_NAME) || '' }}
          build-args: |
            OMNI_COMPONENT=${{ env.COMPONENT_NAME }}
            NODE_ENV=${{ inputs.node_env }}
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
            OMNI_COMPONENT_COMMIT=${{ github.sha }}
            OMNI_COMPONENT_VERSION=${{ steps.meta.outputs.version }}

    outputs:
      docker_tags: ${{ steps.meta.outputs.tags }}
      runner: ${{ runner.name }}
